name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const packageVersion = JSON.parse(readFileSync("package.json", "utf8")).version;
            const manifestVersion = JSON.parse(readFileSync("public/manifest.json", "utf8")).version;
            if (process.env.RELEASE_TAG !== `v${packageVersion}` || packageVersion !== manifestVersion) {
              throw new Error(`Tag ${process.env.RELEASE_TAG}, package ${packageVersion}, and manifest ${manifestVersion} must match`);
            }
          '
      - run: pnpm build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          zip -r "../ex-02-lumina-${GITHUB_REF_NAME}.zip" .
          cd ..
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "ex-02-lumina-${GITHUB_REF_NAME}.zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "ex-02-lumina-${GITHUB_REF_NAME}.zip" --verify-tag --generate-notes
          fi
